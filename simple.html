<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./bower_components/webaudio-controls/webaudio-controls.js"></script>
<script src="./webaudio-tinysynth.js"></script>
<style>
.error{
  color:#c00;
}
</style>
<script>
var synth, kb;
/* Notes this page is sounding, by input: each note-off goes to the note that was
   sent, and losing focus releases them all, so no note is left stuck. */
var held={};
async function Init(){
  synth=new WebAudioTinySynth();
  kb=document.getElementById("keyboard");
  kb.addEventListener("change",KeyIn);
  kb.addEventListener("focusout",ReleaseAll);
  window.addEventListener("blur",ReleaseAll);
  window.addEventListener("pagehide",ReleaseAll);
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState=="hidden")
      ReleaseAll();
  });
  document.getElementById("file").addEventListener("cancel",function(){
    ShowMessage("No file selected. The current song is unchanged.");
  });

  await synth.ready();

  for(var i=0;i<128;++i){
    var o=document.createElement("option");
    o.innerHTML=(i+1)+" : "+synth.getTimbreName(0,i);
    document.getElementById("prog").appendChild(o);
  }
}
function Prog(pg){
  synth.send([0xc0,pg]);
}
function NoteOn(key,ch,n,v,disp){
  NoteOff(key);
  held[key]={ch:ch,n:n,disp:disp};
  synth.send([0x90+ch,n,v]);
}
function NoteOff(key){
  var h=held[key];
  if(!h)
    return;
  delete held[key];
  synth.send([0x80+h.ch,h.n,0]);
  if(h.disp!=undefined)
    kb.setNote(0,h.disp);
}
function ReleaseAll(){
  /* The keyboard ends a mouse drag on a window mouseup, which a lost focus can
     swallow; end it here, or moving the mouse later would play notes. A key it
     still thinks is down would ignore the next press of that key. */
  window.dispatchEvent(new MouseEvent("mouseup"));
  kb.currentKey=-1;
  for(var key in held)
    NoteOff(key);
}
function KeyIn(e){
  if(e.note[0])
    NoteOn("kb"+e.note[1],0,e.note[1],100,e.note[1]);
  else
    NoteOff("kb"+e.note[1]);
}
function ShowMessage(text,error){
  var m=document.getElementById("message");
  m.textContent=text;
  m.className=error?"error":"";
}
var loadCount=0;
function LoadMidi(files){
  var file=files&&files[0];
  var load=++loadCount;
  if(!file){
    ShowMessage("No file selected. The current song is unchanged.");
    return;
  }
  var reader=new FileReader();
  reader.onload=function(){
    if(load!=loadCount)
      return;
    try{
      synth.loadMIDI(reader.result);
    }
    catch(e){
      ShowMessage("Could not load "+file.name+" ("+e.message+"). The current song is unchanged.",true);
      return;
    }
    ShowMessage("Playing "+file.name+".");
    synth.playMIDI();
  };
  reader.onerror=function(){
    if(load==loadCount)
      ShowMessage("Could not read "+file.name+" ("+(reader.error?reader.error.message:"unknown error")+"). The current song is unchanged.",true);
  };
  reader.readAsArrayBuffer(file);
}
window.onload=function(){
  Init();
}

</script>
</head>
<body>
<h1>TinySynth Simple Test Page</h1>
<ul>
  <li>Select timbre with dropdown</li>
  <li>Playable with mouse or qwerty-keyboard.</li>
  <li>Choose a MIDI file (.mid) to play it.</li>
</ul>
Prog : <select id="prog" onchange="Prog(this.selectedIndex)"></select>
<br/>
<webaudio-keyboard id="keyboard" min="48"></webaudio-keyboard>
<br/>
MIDI file : <input id="file" type="file" accept=".mid,.midi" onchange="LoadMidi(this.files)"/>
<button onclick="synth.playMIDI()">Play</button>
<button onclick="synth.stopMIDI()">Stop</button>
<div id="message" role="status"></div>
<hr/>
Repository : <b><a href="https://github.com/g200kg/webaudio-tinysynth">https://github.com/g200kg/webaudio-tinysynth</a></b>
</body>
</html>
