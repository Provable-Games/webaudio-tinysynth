# Claude review. The required check is the "Claude review gate" job.
# Model and effort come only from the Actions variables CLAUDE_REVIEW_MODEL and
# CLAUDE_REVIEW_EFFORT. The pinned base action below fixes the Claude Code version.
# Setup, trust boundary and bootstrap rules: .github/scripts/README.md.
name: Claude Review

on:
  pull_request:
    # edited: only a base change re-runs the review (see the guards below).
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions: {}

# A title or body edit joins its own group, so it never cancels a review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !github.event.changes.base && '-metadata' || '' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Claude review setup
    # A title or body edit (no base change) starts nothing.
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      policy: ${{ steps.policy.outputs.policy }}
      matrix: ${{ steps.policy.outputs.matrix }}
      merge_base: ${{ steps.policy.outputs.merge_base }}
      config_sha: ${{ steps.trust.outputs.config_sha }}
      bootstrap: ${{ steps.trust.outputs.bootstrap }}
    steps:
      - name: Check out the pull request head as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: src

      - name: Choose the trusted review configuration
        id: trust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Bases that may take the configuration from the pull request head
          # while they lack it: only main, for the one-time path that lands it.
          BOOTSTRAP_BASE_BRANCHES: main
        run: |
          # begin trusted-config-selection
          set -euo pipefail
          if ! git -C src cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git -C src fetch --no-tags --quiet origin "$BASE_SHA"
          fi
          git -C src cat-file -e "$BASE_SHA^{commit}"
          if git -C src cat-file -e "$BASE_SHA:.github/review-agents.json" 2>/dev/null; then
            config_sha="$BASE_SHA"
            bootstrap=false
          elif [[ " $BOOTSTRAP_BASE_BRANCHES " == *" $BASE_REF "* ]]; then
            config_sha="$HEAD_SHA"
            bootstrap=true
            echo "::warning title=AI review bootstrap::Base revision $BASE_SHA has no .github/review-agents.json, so this review uses the review configuration from the pull request head $HEAD_SHA."
          else
            echo "::error title=AI review configuration::Base branch '$BASE_REF' ($BASE_SHA) has no .github/review-agents.json. Bootstrap from the pull request head is allowed only for: $BOOTSTRAP_BASE_BRANCHES. Land the review configuration on '$BASE_REF' first."
            exit 1
          fi
          echo "config_sha=$config_sha" >> "$GITHUB_OUTPUT"
          echo "bootstrap=$bootstrap" >> "$GITHUB_OUTPUT"
          # end trusted-config-selection

      - name: Check out the trusted review configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trust.outputs.config_sha }}
          persist-credentials: false
          path: trusted
          sparse-checkout: |
            .github/review-agents.json
            .github/prompts
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Decide the review policy and scope
        id: policy
        env:
          CONFIG_SHA: ${{ steps.trust.outputs.config_sha }}
          BOOTSTRAP: ${{ steps.trust.outputs.bootstrap }}
        run: >-
          python3 -I -B trusted/.github/scripts/review.py prepare --config-root trusted --repo-dir src
          --event "$GITHUB_EVENT_PATH" --config-sha "$CONFIG_SHA" --bootstrap "$BOOTSTRAP"

  review:
    name: Claude review / ${{ matrix.agent_id }}
    needs: prepare
    # Credentials are used only for same-repository, non-draft pull requests.
    if: >-
      needs.prepare.outputs.policy == 'review'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out the trusted review configuration
        id: trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.config_sha }}
          persist-credentials: false
          path: trusted
          sparse-checkout: |
            .github/review-agents.json
            .github/prompts
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Fingerprint the trusted configuration
        id: fingerprint
        run: |
          # begin trusted-fingerprint
          set -euo pipefail
          digest="$(cd trusted && find .github -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          # end trusted-fingerprint
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Check out the pull request head as data
        id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: src

      - name: Validate the central model and effort settings
        id: settings
        env:
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          CLAUDE_REVIEW_EFFORT: ${{ vars.CLAUDE_REVIEW_EFFORT }}
        run: python3 -I -B trusted/.github/scripts/review.py config --config-root trusted --provider claude

      - name: Check the review credential
        id: credential
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error title=AI review configuration::The CLAUDE_CODE_OAUTH_TOKEN secret is not available to this workflow run."
            exit 1
          fi

      - name: Build the review prompt
        id: prompt
        env:
          CONFIG_SHA: ${{ needs.prepare.outputs.config_sha }}
          BOOTSTRAP: ${{ needs.prepare.outputs.bootstrap }}
          AGENT_ID: ${{ matrix.agent_id }}
        run: >-
          python3 -I -B trusted/.github/scripts/review.py prompt --config-root trusted --provider claude
          --repo-dir src --event "$GITHUB_EVENT_PATH" --agent-id "$AGENT_ID"
          --out-dir "$RUNNER_TEMP/review" --config-sha "$CONFIG_SHA" --bootstrap "$BOOTSTRAP"

      # The action changes into CLAUDE_WORKING_DIR and runs Bun there, and Bun
      # loads bunfig.toml (preloads) and .env files from that directory. It must
      # therefore be a trusted empty directory, never the pull request checkout.
      - name: Prepare an empty working directory for Claude
        id: workdir
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/claude-cwd"
          mkdir -p "$dir"
          if [ -n "$(ls -A "$dir")" ]; then
            echo "::error title=AI review integrity::$dir is not empty."
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "config_dir=$HOME/.claude" >> "$GITHUB_OUTPUT"

      - name: Build the Claude arguments
        id: args
        env:
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          CLAUDE_REVIEW_EFFORT: ${{ vars.CLAUDE_REVIEW_EFFORT }}
          CONTEXT_DIR: ${{ steps.prompt.outputs.context_dir }}
        run: >-
          python3 -I -B trusted/.github/scripts/review.py claude-args --config-root trusted
          --add-dir "$GITHUB_WORKSPACE/src" --add-dir "$CONTEXT_DIR"

      # The base action runs Claude Code without GitHub tools or a GitHub token.
      # Its SHA fixes the Claude Code version it installs (2.1.288 for v1.0.240).
      # The environment below presets every variable that could redirect the
      # model, effort, configuration, proxy or runtime to trusted values.
      - name: Run the Claude review
        id: claude
        uses: anthropics/claude-code-action/base-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        env:
          CLAUDE_WORKING_DIR: ${{ steps.workdir.outputs.dir }}
          ANTHROPIC_MODEL: ${{ steps.settings.outputs.model }}
          CLAUDE_CODE_EFFORT_LEVEL: ""
          CLAUDE_CONFIG_DIR: ${{ steps.workdir.outputs.config_dir }}
          CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
          CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD: "0"
          HTTPS_PROXY: ""
          HTTP_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: ""
          NODE_OPTIONS: ""
          NODE_EXTRA_CA_CERTS: ""
          BUN_OPTIONS: ""
          BUN_CONFIG_REGISTRY: ""
          BUN_CONFIG_TOKEN: ""
        with:
          prompt_file: ${{ steps.prompt.outputs.prompt_file }}
          claude_args: ${{ steps.args.outputs.claude_args }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Verify the trusted configuration
        id: verify
        if: ${{ !cancelled() && steps.fingerprint.outcome == 'success' }}
        env:
          EXPECTED_DIGEST: ${{ steps.fingerprint.outputs.digest }}
        run: |
          # begin trusted-fingerprint
          set -euo pipefail
          digest="$(cd trusted && find .github -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          # end trusted-fingerprint
          if [ "$digest" != "$EXPECTED_DIGEST" ]; then
            echo "::error title=AI review integrity::The trusted review configuration changed during the review run."
            exit 1
          fi

      # Fixed categories only: do not publish the transcript or provider error text.
      # The pinned action throws before exporting its session ID on runtime failure.
      - name: Report the Claude runtime failure category
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.claude.outcome == 'failure' }}
        run: |
          python3 -I -B - <<'PY_DIAGNOSTIC'
          import json, os
          from pathlib import Path
          try:
              messages = json.loads((Path(os.environ["RUNNER_TEMP"]) / "claude-execution-output.json").read_text())
              final = next(m for m in reversed(messages) if isinstance(m, dict) and m.get("type") == "result")
          except (OSError, ValueError, TypeError, StopIteration):
              print("Claude runtime failure category: no readable final result")
          else:
              if final.get("is_error") is True or final.get("subtype") != "success":
                  text = (str(final.get("result", "")) + " " + str(final.get("errors", ""))).lower()
                  categories = {
                      "authentication": ("authentication", "unauthorized", "invalid token", "expired token", "token expired", "not logged in", "please login", "401"),
                      "usage limit": ("usage limit", "rate limit", "limit reached", "out of extra usage", "hit your limit", "reached your limit", "429"),
                      "model unavailable": ("model not found", "unknown model", "invalid model", "model access", "not have access to", "model does not exist", "404"),
                      "billing": ("credit balance", "billing", "payment required", "402"),
                      "network or service": ("connection", "network", "timed out", "overloaded", "503", "529"),
                      "runtime options": ("unknown option", "unrecognized option", "invalid option"),
                  }
                  matched = [name for name, needles in categories.items() if any(n in text for n in needles)]
                  print("Claude runtime failure category: " + (", ".join(matched) or "unclassified provider/runtime error"))
              else:
                  print("Claude runtime failure category: action failed after a successful final result")
          PY_DIAGNOSTIC

      - name: Record the review result
        id: result
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          CLAUDE_REVIEW_EFFORT: ${{ vars.CLAUDE_REVIEW_EFFORT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CONFIG_SHA: ${{ needs.prepare.outputs.config_sha }}
          BOOTSTRAP: ${{ needs.prepare.outputs.bootstrap }}
          MERGE_BASE: ${{ needs.prepare.outputs.merge_base }}
          AGENT_ID: ${{ matrix.agent_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
          ACTION_OUTCOME: ${{ steps.claude.outcome }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          WORKDIR: ${{ steps.workdir.outputs.dir }}
          OUTCOMES: >-
            checkout=${{ steps.source.outcome }}
            settings=${{ steps.settings.outcome }}
            credential=${{ steps.credential.outcome }}
            prompt=${{ steps.prompt.outcome }}
            workdir=${{ steps.workdir.outcome }}
            arguments=${{ steps.args.outcome }}
        run: |
          set -euo pipefail
          steps=()
          for outcome in $OUTCOMES; do steps+=(--step "$outcome"); done
          python3 -I -B trusted/.github/scripts/review.py result --config-root trusted --provider claude \
            --event "$GITHUB_EVENT_PATH" --agent-id "$AGENT_ID" --out-dir "$RUNNER_TEMP/review/out" \
            --config-sha "$CONFIG_SHA" --bootstrap "$BOOTSTRAP" --merge-base "$MERGE_BASE" --run-url "$RUN_URL" \
            --execution-file "$EXECUTION_FILE" --action-outcome "$ACTION_OUTCOME" --conclusion "$CONCLUSION" \
            --expected-execution-file "$RUNNER_TEMP/claude-execution-output.json" --session-id "$SESSION_ID" \
            --expected-cwd "$WORKDIR" "${steps[@]}"

      # One bounded retry (.github/scripts/README.md, "Retry"). The first result
      # step asks for it only when the output is malformed and carries no review
      # content (review_lib.retryable_output); output with a finding, a severity
      # or a location is never retried. The retry runs the same action with the
      # same prompt, arguments and environment, from the same verified-empty
      # directory; the trusted configuration is verified again before its result
      # is recorded, and that result replaces the first.
      - name: Prepare the retry
        id: retry_setup
        if: ${{ !cancelled() && steps.result.outputs.retry == 'true' }}
        env:
          WORKDIR: ${{ steps.workdir.outputs.dir }}
        run: |
          set -euo pipefail
          if [ -n "$(ls -A "$WORKDIR")" ]; then
            echo "::error title=AI review integrity::$WORKDIR is not empty."
            exit 1
          fi
          mv "$RUNNER_TEMP/review/out" "$RUNNER_TEMP/review/attempt-1"

      - name: Run the Claude review again (retry)
        id: claude_retry
        if: ${{ !cancelled() && steps.retry_setup.outcome == 'success' }}
        uses: anthropics/claude-code-action/base-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        env:
          CLAUDE_WORKING_DIR: ${{ steps.workdir.outputs.dir }}
          ANTHROPIC_MODEL: ${{ steps.settings.outputs.model }}
          CLAUDE_CODE_EFFORT_LEVEL: ""
          CLAUDE_CONFIG_DIR: ${{ steps.workdir.outputs.config_dir }}
          CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
          CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD: "0"
          HTTPS_PROXY: ""
          HTTP_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: ""
          NODE_OPTIONS: ""
          NODE_EXTRA_CA_CERTS: ""
          BUN_OPTIONS: ""
          BUN_CONFIG_REGISTRY: ""
          BUN_CONFIG_TOKEN: ""
        with:
          prompt_file: ${{ steps.prompt.outputs.prompt_file }}
          claude_args: ${{ steps.args.outputs.claude_args }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Verify the trusted configuration after the retry
        id: verify_retry
        if: ${{ !cancelled() && steps.result.outputs.retry == 'true' && steps.fingerprint.outcome == 'success' }}
        env:
          EXPECTED_DIGEST: ${{ steps.fingerprint.outputs.digest }}
        run: |
          # begin trusted-fingerprint
          set -euo pipefail
          digest="$(cd trusted && find .github -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          # end trusted-fingerprint
          if [ "$digest" != "$EXPECTED_DIGEST" ]; then
            echo "::error title=AI review integrity::The trusted review configuration changed during the review run."
            exit 1
          fi

      - name: Record the retry's review result
        id: result_retry
        if: ${{ !cancelled() && steps.verify_retry.outcome == 'success' }}
        env:
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          CLAUDE_REVIEW_EFFORT: ${{ vars.CLAUDE_REVIEW_EFFORT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CONFIG_SHA: ${{ needs.prepare.outputs.config_sha }}
          BOOTSTRAP: ${{ needs.prepare.outputs.bootstrap }}
          MERGE_BASE: ${{ needs.prepare.outputs.merge_base }}
          AGENT_ID: ${{ matrix.agent_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          EXECUTION_FILE: ${{ steps.claude_retry.outputs.execution_file }}
          SESSION_ID: ${{ steps.claude_retry.outputs.session_id }}
          ACTION_OUTCOME: ${{ steps.claude_retry.outcome }}
          CONCLUSION: ${{ steps.claude_retry.outputs.conclusion }}
          WORKDIR: ${{ steps.workdir.outputs.dir }}
          OUTCOMES: >-
            checkout=${{ steps.source.outcome }}
            settings=${{ steps.settings.outcome }}
            credential=${{ steps.credential.outcome }}
            prompt=${{ steps.prompt.outcome }}
            workdir=${{ steps.workdir.outcome }}
            arguments=${{ steps.args.outcome }}
            retry-setup=${{ steps.retry_setup.outcome }}
        run: |
          set -euo pipefail
          steps=()
          for outcome in $OUTCOMES; do steps+=(--step "$outcome"); done
          python3 -I -B trusted/.github/scripts/review.py result --config-root trusted --provider claude \
            --event "$GITHUB_EVENT_PATH" --agent-id "$AGENT_ID" --out-dir "$RUNNER_TEMP/review/out" \
            --config-sha "$CONFIG_SHA" --bootstrap "$BOOTSTRAP" --merge-base "$MERGE_BASE" --run-url "$RUN_URL" \
            --execution-file "$EXECUTION_FILE" --action-outcome "$ACTION_OUTCOME" --conclusion "$CONCLUSION" \
            --expected-execution-file "$RUNNER_TEMP/claude-execution-output.json" --session-id "$SESSION_ID" \
            --expected-cwd "$WORKDIR" --previous-out "$RUNNER_TEMP/review/attempt-1" "${steps[@]}"

      - name: Upload the review result
        if: >-
          ${{ !cancelled() && steps.result.outcome == 'success'
          && (steps.result.outputs.retry != 'true' || steps.result_retry.outcome == 'success') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-review-${{ matrix.agent_id }}
          path: |
            ${{ runner.temp }}/review/out/result.json
            ${{ runner.temp }}/review/out/review.md
          if-no-files-found: error
          retention-days: 1

      - name: Require a completed review
        if: ${{ !cancelled() }}
        run: |
          result="$RUNNER_TEMP/review/out/result.json"
          if ! jq -e '.status == "complete"' "$result" >/dev/null 2>&1; then
            echo "::error title=AI review::The review did not complete: $(jq -r '(.status // "missing") + ": " + ((.errors // []) | join("; "))' "$result" 2>/dev/null || echo 'no result was recorded')"
            exit 1
          fi

  publish:
    name: Claude review comment
    needs: [prepare, review]
    if: >-
      !cancelled() && needs.prepare.outputs.policy == 'review'
      && (needs.review.result == 'success' || needs.review.result == 'failure')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the trusted review configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.config_sha }}
          persist-credentials: false
          path: trusted
          sparse-checkout: |
            .github/review-agents.json
            .github/prompts
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download the review results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: claude-review-*
          path: ${{ runner.temp }}/results

      - name: Publish the review comment
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: >-
          python3 -I -B trusted/.github/scripts/review.py publish --config-root trusted --provider claude
          --event "$GITHUB_EVENT_PATH" --results-dir "$RUNNER_TEMP/results" --matrix "$MATRIX"
          --review-job-result "$REVIEW_RESULT"

  gate:
    # A title or body edit gets a different check name, so its skipped job can
    # never stand in for the required "Claude review gate" of a real run.
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'Claude review gate (title or body edit, not evaluated)' || 'Claude review gate' }}
    needs: [prepare, review, publish]
    if: ${{ always() && !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require review setup
        if: needs.prepare.result != 'success'
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: |
          echo "::error title=AI review gate::Claude review setup did not succeed ($PREPARE_RESULT)."
          exit 1

      - name: Check out the trusted review configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.config_sha }}
          persist-credentials: false
          path: trusted
          sparse-checkout: |
            .github/review-agents.json
            .github/prompts
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download the review results
        if: needs.prepare.outputs.policy == 'review'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: claude-review-*
          path: ${{ runner.temp }}/results

      - name: Evaluate the gate
        env:
          POLICY: ${{ needs.prepare.outputs.policy }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: >-
          python3 -I -B trusted/.github/scripts/review.py gate --config-root trusted --provider claude
          --event "$GITHUB_EVENT_PATH" --results-dir "$RUNNER_TEMP/results" --policy "$POLICY"
          --matrix "$MATRIX" --prepare-result "$PREPARE_RESULT" --review-result "$REVIEW_RESULT"
          --publish-result "$PUBLISH_RESULT"
