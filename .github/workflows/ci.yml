name: CI

# Lint, build verification, unit/native/regression tests and the offline
# Chromium smoke test. Commands are the npm scripts in package.json.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  build-verify:
    name: build-verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Committed distribution equals a fresh pinned build and is safe to inline
        run: npm run verify
      - name: Rebuild in place and fail on artifact drift
        run: |
          npm run build
          git diff --exit-code -- webaudio-tinysynth.min.js webaudio-tinysynth.min.js.map
      - name: Packed package contents and scratch-consumer require()
        run: npm run pack:check
      - name: Sizes and SHA-256
        run: |
          npm run --silent size | tee size.txt
          { echo '```'; cat size.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the regressions read the upstream reference from git history
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build and fail on artifact drift
        id: build
        run: |
          npm run build
          git diff --exit-code -- webaudio-tinysynth.min.js webaudio-tinysynth.min.js.map
      # Each suite runs and reports even if an earlier suite failed.
      - name: Unit tests (Vitest)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:unit
      - name: Native Node tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:node
      - name: Regression scripts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:regression

  browser-smoke:
    name: browser-smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build and fail on artifact drift
        run: |
          npm run build
          git diff --exit-code -- webaudio-tinysynth.min.js webaudio-tinysynth.min.js.map
      - name: Install the pinned Playwright's Chromium headless shell and system libraries
        run: npx playwright-core install --with-deps --only-shell chromium
      # Offline smoke for both builds. It launches Chromium with autoplay allowed,
      # so it does not show that audio starts after a user gesture.
      - name: Offline browser smoke test
        run: npm run test:browser
