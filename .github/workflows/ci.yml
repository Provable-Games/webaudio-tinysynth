name: CI

# Lint, build verification, unit/native/regression tests and the offline
# Chromium smoke test. Commands are the npm scripts in package.json.
#
# Every job tests a fresh build of the checked-out source (scripts/test-build.js
# builds into the ignored .build/). The committed webaudio-tinysynth.min.js and
# map are regenerated by dist.yml on improve/integration after each merge, and
# change on main only in a manual release pull request. So build-verify
# (scripts/check-dist.js) passes a pull request that leaves them unchanged, or
# whose head is improve/integration or release/* and whose copy equals a fresh
# build. Pushes to main compare no committed copy: between releases main's may
# lag the source.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  build-verify:
    name: build-verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Pull requests: min.js and map unchanged from the base, or (improve/integration and
      # release/* only) equal to a fresh build. Always: a fresh build and the source are
      # safe to inline.
      - name: Generated files follow the pull request rule
        run: node scripts/check-dist.js --github
      - name: Packed package contents and scratch-consumer require() (fresh build)
        run: npm run pack:check
      - name: Sizes and SHA-256 (fresh build)
        run: |
          npm run --silent size | tee size.txt
          { echo '```'; cat size.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the regressions read the upstream reference from git history
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Fresh build of the current source into .build/
        id: build
        run: node scripts/test-build.js
      # Each suite runs and reports even if an earlier suite failed.
      - name: Unit tests (Vitest)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:unit
      - name: Native Node tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:node
      - name: Regression scripts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:regression

  browser-smoke:
    name: browser-smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Fresh build of the current source into .build/
        run: node scripts/test-build.js
      - name: Install the pinned Playwright's Chromium headless shell and system libraries
        run: npx playwright-core install --with-deps --only-shell chromium
      # Offline smoke for both builds. It launches Chromium with autoplay allowed,
      # so it does not show that audio starts after a user gesture.
      - name: Offline browser smoke test
        run: npm run test:browser
