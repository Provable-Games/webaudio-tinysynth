# Tests the AI review helpers and lints every workflow (read-only). No credentials.
name: Review Helpers

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, improve/integration]

permissions:
  contents: read

concurrency:
  group: review-helpers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Review helper tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the helper tests
        run: |
          python3 --version
          git --version
          python3 -I -B -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Lint all workflows and the review scripts
        env:
          ACTIONLINT_VERSION: 1.7.12
          # sha256 of actionlint_1.7.12_linux_arm64.tar.gz from the release's checksums.txt
          ACTIONLINT_SHA256: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_arm64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          shellcheck --version
          shellcheck .github/scripts/*.sh
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml
