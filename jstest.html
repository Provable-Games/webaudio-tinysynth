<!doctype html>
<html>
<head>
<script src="webaudio-tinysynth.js"></script>
<style>
button[data-note]{
  touch-action:none;
}
.error{
  color:#c00;
}
</style>
<script>

function loadMidiUrl(){
  synth.loadMIDIUrl('ws.mid');
}
function showMessage(text,error){
  var m=document.getElementById("message");
  m.textContent=text;
  m.className=error?"error":"";
}
var loadCount=0;
function loadMidi(files){
  var file=files&&files[0];
  var load=++loadCount;
  if(!file){
    showMessage("No file selected. The current song is unchanged.");
    return;
  }
  var reader = new FileReader();
  reader.onload=(e)=>{
    if(load!=loadCount)
      return;
    try{
      synth.loadMIDI(reader.result);
    }
    catch(err){
      showMessage("Could not load "+file.name+" ("+err.message+"). The current song is unchanged.",true);
      return;
    }
    showMessage("Loaded "+file.name+". Press Play.");
  }
  reader.onerror=()=>{
    if(load==loadCount)
      showMessage("Could not read "+file.name+" ("+(reader.error?reader.error.message:"unknown error")+"). The current song is unchanged.",true);
  }
  reader.readAsArrayBuffer(file);
}
function playMidi(){
  synth.playMIDI();
}
function stopMidi(){
  synth.stopMIDI();
}
function SetProgram(p){
  synth.send([0xc0,p]);
}
/* Notes this page is sounding, by input: each note-off goes to the note that was
   sent, and losing focus releases them all, so no note is left stuck. */
var held={};
function noteOn(key,n){
  noteOff(key);
  held[key]=n;
  synth.send([0x90,n,100]);
}
function noteOff(key){
  if(!(key in held))
    return;
  var n=held[key];
  delete held[key];
  synth.send([0x80,n,0]);
}
function releaseAll(){
  for(var key in held)
    noteOff(key);
}
/* A button that sounds its note while held: by a pointer (mouse, pen or touch),
   captured so that a release outside the button still ends the note, or by
   Space or Enter while it has focus. */
function noteButton(b){
  var n=+b.dataset.note;
  b.addEventListener("pointerdown",function(e){
    if(e.button!=0)
      return;
    try{
      b.setPointerCapture(e.pointerId);
    }
    catch(err){ /* the pointer is already gone; pointerup or pointercancel still ends the note */ }
    noteOn(n+"p"+e.pointerId,n);
  });
  var up=function(e){noteOff(n+"p"+e.pointerId);};
  b.addEventListener("pointerup",up);
  b.addEventListener("pointercancel",up);
  b.addEventListener("lostpointercapture",up);
  b.addEventListener("keydown",function(e){
    if(e.key!=" "&&e.key!="Enter")
      return;
    e.preventDefault();
    if(!e.repeat&&!((n+"k") in held))
      noteOn(n+"k",n);
  });
  b.addEventListener("keyup",function(e){
    if(e.key==" "||e.key=="Enter")
      noteOff(n+"k");
  });
  b.addEventListener("focusout",function(){noteOff(n+"k");});
}
function Init(){
  synth=new WebAudioTinySynth({voices:64});
  for(var i=0;i<128;++i){
    var o=document.createElement("option");
    o.innerHTML=synth.getTimbreName(0,i);
    document.getElementById("prog").appendChild(o);
  }
  // Show the engine's settings rather than fixed defaults.
  document.getElementById("loop").checked=!!synth.loop;
  document.getElementById("vol").value=synth.masterVol*100;
  document.getElementById("rev").value=synth.reverbLev*100;
  document.getElementById("quality").selectedIndex=synth.quality?1:0;
  document.querySelectorAll("button[data-note]").forEach(noteButton);
  window.addEventListener("blur",releaseAll);
  window.addEventListener("pagehide",releaseAll);
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState=="hidden")
      releaseAll();
  });
  document.getElementById("file").addEventListener("cancel",function(){
    showMessage("No file selected. The current song is unchanged.");
  });
  var showStatus=function(){
    var st=synth.getPlayStatus();
    document.getElementById("status").innerHTML="Play:"+st.play+"  Pos:"+st.curTick+"/"+st.maxTick;
  };
  showStatus();   // at once: a line filled in 100 ms later would move the buttons below it
  setInterval(showStatus,100);
}
function Test(){
  var o=synth.getAudioContext().createOscillator();
  o.connect(synth.getAudioContext().destination);
  o.start(0);
  o.stop(synth.getAudioContext().currentTime+1);
  console.log(synth)
}
window.onload=Init;

</script>
</head>
<body>
<h1>webaudio-tinysynth : js version test</h1>
This is a simple sample of webaudio-tinysynth (JavaScript library version) page.
<hr/>
<button onclick="Test()">Test audioContext</button>
<hr/>
Load Sample MIDI from URL : <button onclick="loadMidiUrl()">Load (ws.mid)</button><br/>
Load MIDI file from local : <input id="file" type="file" accept=".mid,.midi" onchange="loadMidi(this.files)"/><br/>
<div id="message" role="status"></div>
<button onclick="playMidi()">Play</button>
<button onclick="stopMidi()">Stop</button>
<div id="status"></div>
<br/><br/>
Loop : <input id="loop" type="checkbox" onchange="synth.setLoop(this.checked)"/><br/>
MasterVol<br/>
<input id="vol" type="range" value="50" min="0" max="100" oninput="synth.setMasterVol(this.value/100)"/><br/>
ReverbLev<br/>
<input id="rev" type="range" value="50" min="0" max="100" oninput="synth.setReverbLev(this.value/100)"/><br/>

<br/><br/>
Quality : <select id="quality" onchange="synth.setQuality(this.selectedIndex)"><option>Quality=0</option><option selected>Quality=1</option></select>
<br/>
Timbre : <select id="prog" onchange="SetProgram(this.selectedIndex)"></select>
<br/>
<br/>
Play by keys (hold with the mouse or touch, or Space/Enter) :<br/>
  <button data-note="60">C</button>
  <button data-note="62">D</button>
  <button data-note="64">E</button>
  <button data-note="65">F</button>
  <button data-note="67">G</button>
  <button data-note="69">A</button>
  <button data-note="71">B</button>
  <button data-note="72">C</button>
</body>
</html>
